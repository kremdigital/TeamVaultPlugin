# Release workflow — triggered by pushing a version tag.
#
# Obsidian's Community Plugins directory requires the GitHub release tag
# to be the *exact* manifest version with no `v` prefix (e.g. `0.1.0`).
#
# Builds `main.js` from source and publishes a GitHub release with the
# three Obsidian-required artifacts: `main.js`, `manifest.json`,
# `styles.css` (versioned since 0.3.0 — the plugin's own styling lives
# there rather than in inline `el.style` assignments). The three files get
# a signed build provenance attestation, and the release body is the
# tag's section of CHANGELOG.md.
#
# Bump `manifest.json#version` + `versions.json` on `main`, commit, then:
#   git tag 0.1.0 && git push origin 0.1.0

name: Release

on:
  push:
    tags:
      # Flat form only. `npm version` also makes a local `vX.Y.Z` tag, but
      # pushing it would fire this workflow twice and try to publish a second,
      # duplicate release — and the directory only ever looks at the tag that
      # equals `manifest.json#version`. Don't push the `v` tag.
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Sign the build provenance attestation (Sigstore via the OIDC token)
      # and store it — the directory recommends attested release assets.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sanity gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test

      - name: Build
        run: pnpm build

      - name: Validate manifest + versions.json match the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "manifest.json version ($manifest) does not match tag ($tag)" >&2
            exit 1
          fi
          # versions.json must carry the version so the catalogue knows the
          # minAppVersion for this release.
          has_version=$(node -p "Object.prototype.hasOwnProperty.call(require('./versions.json'), '$tag')")
          if [ "$has_version" != "true" ]; then
            echo "versions.json is missing an entry for $tag" >&2
            exit 1
          fi

      # Only this version's section, not the whole file: through 0.3.4 every
      # release page repeated the project's entire history. Fails when
      # CHANGELOG.md has no section for the tag.
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF#refs/tags/}" > "$RUNNER_TEMP/release-notes.md"

      # Official Obsidian template ("Release your plugin with GitHub
      # Actions"): after every check, so a release that fails validation
      # leaves no attestation behind.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Use the exact tag as the release name — no "Team Vault"
          # prefix — so it reads cleanly in the catalogue listing.
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
